name: Thesis
description: >-
  Thesis Care is a healthcare AI company that deploys clinical support agents
  backed by expert clinicians — nurses and care managers — to help physician
  groups, health systems, and health plans scale care management, care
  delivery, and clinical operations. Its platform pairs automation with human
  clinical oversight so work gets done end-to-end to deliver outcomes rather
  than create more work, handling the complex cases and edge scenarios that
  pure technology cannot. The company is SOC 2 Type II and HIPAA compliant and
  has announced a Series A round. Thesis Care publishes no public API or
  developer surface at this time; this API Evangelist profile captures the
  company's identity, security posture, and published compliance program.
